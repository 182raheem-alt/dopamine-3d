name: Render video
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chrome libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libcups2 libasound2t64 libpango-1.0-0 libcairo2 || true
      - run: npm install --legacy-peer-deps
      - run: npx remotion render Dopamine out/video.mp4 --gl=swangle --log=info
      - uses: actions/upload-artifact@v4
        with:
          name: dopamine-video
          path: out/video.mp4
